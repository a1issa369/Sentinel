version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 5

  payment-service:
    build: ./payment-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002

  order-service:
    build: ./order-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      PAYMENT_SERVICE_URL: http://payment-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ORDER_SERVICE_URL: http://order-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
    depends_on:
      - order-service
      - payment-service

  traffic-generator:
    build: ./traffic-generator
    environment:
      GATEWAY_URL: http://gateway:8000
      REQUESTS_PER_SECOND: 3
    depends_on:
      - gateway

volumes:
  pgdata:
